<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>살까말까 연구소 · 영상 속 상품</title>
<meta name="description" content="살까말까 연구소 쇼츠에 나온 상품을 번호로 찾아보세요.">
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --yellow: #FFD43B; --navy: #1E2240; --coral: #FF6B5B;
    --bg: #F6F5F0; --card: #FFFFFF; --text: #1E2240; --muted: #6B6F86; --line: #E6E4DC;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: Pretendard, "Malgun Gothic", sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 48px; }

  header { background: var(--navy); color: #fff; padding: 28px 16px 22px; }
  header .wrap { padding-bottom: 0; display: flex; align-items: center; gap: 14px; }
  header svg { width: 56px; height: 56px; flex: none; }
  header h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
  header h1 b { color: var(--yellow); }
  header p { margin: 4px 0 0; font-size: 14px; color: #C9CCE8; }

  .notice { margin: 16px 0 0; padding: 12px 14px; background: #FFF6D1; border-radius: 12px; font-size: 13px; line-height: 1.5; color: #5A4A00; }

  .search { margin: 18px 0 12px; position: relative; }
  .search label { display: block; font-size: 15px; font-weight: 700; margin-bottom: 8px; }
  .search input { width: 100%; height: 54px; border: 2px solid var(--navy); border-radius: 14px; padding: 0 16px 0 46px; font: inherit; font-size: 18px; font-weight: 700; background: #fff; color: var(--text); }
  .search input:focus { outline: 3px solid var(--yellow); outline-offset: 1px; }
  .search .hash { position: absolute; left: 18px; bottom: 14px; font-size: 20px; font-weight: 800; color: var(--muted); }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 8px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { flex: none; height: 36px; padding: 0 14px; border-radius: 18px; border: 1.5px solid var(--line); background: #fff; font: inherit; font-size: 14px; font-weight: 600; color: var(--text); cursor: pointer; }
  .chips button[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }

  .count { font-size: 13px; color: var(--muted); margin: 6px 2px 10px; }

  .list { display: grid; gap: 12px; }
  .card { background: var(--card); border-radius: 16px; padding: 16px; border: 1.5px solid var(--line); scroll-margin-top: 16px; }
  .card.hit { border-color: var(--coral); box-shadow: 0 0 0 3px rgba(255,107,91,.18); }
  .top { display: flex; gap: 12px; align-items: flex-start; }
  .thumb { width: 80px; height: 80px; border-radius: 12px; background: #FFF6D1; display: grid; place-items: center; font-size: 32px; flex: none; overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
  .meta { min-width: 0; flex: 1; }
  .row1 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .no { font-weight: 800; font-size: 15px; background: var(--yellow); color: var(--navy); border-radius: 8px; padding: 2px 8px; }
  .tag { font-size: 12px; font-weight: 700; border-radius: 6px; padding: 3px 7px; }
  .tag.buy { background: #E3F6EA; color: #17703A; }
  .tag.maybe { background: #FFEDE0; color: #A04A12; }
  .tag.sample { background: #EEE; color: #777; }
  .name { margin: 6px 0 0; font-size: 16px; font-weight: 700; line-height: 1.35; word-break: keep-all; }
  .one { margin: 8px 0 0; font-size: 14px; line-height: 1.5; color: #3B3F58; word-break: keep-all; }
  .price { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
  .price strong { font-size: 17px; color: var(--text); }
  .btns { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 14px; }
  .btns a { display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 12px; font-weight: 800; font-size: 16px; text-decoration: none; }
  .buy-btn { background: var(--coral); color: #fff; }
  .buy-btn.off { display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 12px; background: #EEE; color: #777; font-size: 14px; font-weight: 600; text-align: center; padding: 0 8px; }
  .vid-btn { padding: 0 16px; background: #fff; color: var(--navy); border: 1.5px solid var(--navy); font-size: 14px !important; }

  .empty { text-align: center; padding: 40px 16px; color: var(--muted); font-size: 15px; line-height: 1.6; }

  footer { margin-top: 32px; font-size: 12px; line-height: 1.7; color: var(--muted); }
  footer p { margin: 0 0 6px; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <svg viewBox="0 0 800 800" aria-hidden="true">
      <circle cx="400" cy="400" r="400" fill="#FFD43B"/>
      <path d="M150 260 H240" stroke="#1E2240" stroke-width="30" stroke-linecap="round"/>
      <path d="M230 260 H650 L595 480 H285 Z" fill="#1E2240" stroke="#1E2240" stroke-width="20" stroke-linejoin="round"/>
      <path d="M285 480 L300 540 H585" fill="none" stroke="#1E2240" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="335" cy="605" r="40" fill="#1E2240"/><circle cx="555" cy="605" r="40" fill="#1E2240"/>
      <path d="M355 365 l50 45 l100 -95" fill="none" stroke="#FF6B5B" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div>
      <h1><b>살까말까</b> 연구소</h1>
      <p>영상에 나온 상품을 카테고리별로 찾아보세요</p>
    </div>
  </div>
</header>

<main class="wrap">
  <p class="notice">이 페이지는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다. 구매 가격은 같고, 수수료는 채널 운영에 쓰입니다.</p>

  <div class="search">
    <label for="q">상품 찾기</label>
    <span class="hash">⌕</span>
    <input id="q" type="text" autocomplete="off" placeholder="예: 가습기, 닌자">
  </div>

  <div class="chips" id="chips" role="group" aria-label="카테고리"></div>
  <p class="count" id="count"></p>
  <div class="list" id="list"></div>

  <footer>
    <p>※ 가격은 영상 제작 당시 기준이며, 쿠팡에서 실시간으로 바뀔 수 있어요.</p>
    <p>※ 일부 영상은 AI 도구를 활용해 제작됩니다. 상품 정보는 판매 페이지와 공개된 후기를 바탕으로 정리했습니다.</p>
    <p>© 살까말까 연구소</p>
  </footer>
</main>

<script src="products.js"></script>
<script>
  const products = (window.PRODUCTS || []).slice();  // products.js 순서 그대로(최신 영상이 위)
  const listEl = document.getElementById("list");
  const chipsEl = document.getElementById("chips");
  const countEl = document.getElementById("count");
  const q = document.getElementById("q");
  let category = "전체";

  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };

  function renderChips() {
    const cats = ["전체", ...new Set(products.map(p => p.category).filter(Boolean))];
    chipsEl.replaceChildren(...cats.map(c => {
      const b = el("button", null, c);
      b.type = "button";
      b.setAttribute("aria-pressed", String(c === category));
      b.onclick = () => { category = c; renderChips(); render(); };
      return b;
    }));
  }

  function card(p, hit) {
    const c = el("article", "card" + (hit ? " hit" : ""));
    c.id = "p" + p.no;
    const top = el("div", "top");
    const thumb = el("div", "thumb", p.image ? null : (p.emoji || "🛒"));
    if (p.image) {
      const img = el("img");
      img.src = p.image; img.alt = p.name; img.loading = "lazy";
      thumb.append(img);
    }
    top.append(thumb);
    const meta = el("div", "meta");
    const r1 = el("div", "row1");
    r1.append(el("span", "no", "#" + p.no));
    if (p.rank) r1.append(el("span", "tag buy", `${p.category} 판매량 ${p.rank}위`));
    meta.append(r1, el("p", "name", p.name));
    top.append(meta);
    c.append(top);
    if (p.oneLine) c.append(el("p", "one", p.oneLine));
    if (p.price) {
      const pr = el("p", "price", "영상 기준 ");
      pr.append(el("strong", null, p.price.toLocaleString("ko-KR") + "원"));
      c.append(pr);
    }
    const btns = el("div", "btns");
    if (p.link) {
      const buy = el("a", "buy-btn", "쿠팡에서 보기");
      buy.href = p.link; buy.target = "_blank"; buy.rel = "sponsored nofollow noopener";
      btns.append(buy);
    } else {
      btns.append(el("span", "buy-btn off", "판매자 요청 등으로 링크 제공이 제한된 상품"));
    }
    if (p.video && p.video !== "#") {
      const v = el("a", "vid-btn", "영상 보기");
      v.href = p.video; v.target = "_blank"; v.rel = "noopener";
      btns.append(v);
    } else {
      btns.style.gridTemplateColumns = "1fr";
    }
    c.append(btns);
    return c;
  }

  function render() {
    const query = q.value.trim();
    const num = /^#?\d+$/.test(query) ? query.replace(/\D/g, "") : "";
    let shown = products.filter(p => category === "전체" || p.category === category);
    if (num) shown = shown.filter(p => String(p.no) === num);
    else if (query) shown = shown.filter(p => (p.name + " " + p.category).toLowerCase().includes(query.toLowerCase()));
    countEl.textContent = query ? "" : `상품 ${shown.length}개 · 최신 영상 순`;
    if (!shown.length) {
      const e = el("div", "empty");
      e.textContent = query ? `'${query}'에 맞는 상품이 아직 없어요.` : "아직 등록된 상품이 없어요.";
      listEl.replaceChildren(e);
      return;
    }
    listEl.replaceChildren(...shown.map(p => card(p, num && String(p.no) === num)));
  }

  q.addEventListener("input", () => { category = "전체"; renderChips(); render(); });

  // 주소 끝에 #3 은 그 번호 상품, #가습기 는 그 카테고리를 바로 보여줌
  function applyHash() {
    const h = decodeURIComponent(location.hash.slice(1)).trim();
    if (/^\d+$/.test(h)) { q.value = h; category = "전체"; }
    else if (h && products.some(p => p.category === h)) { q.value = ""; category = h; }
    renderChips();
    render();
  }
  window.addEventListener("hashchange", applyHash);
  applyHash();
</script>
</body>
</html>
